# Optional: run PostgreSQL in Docker instead of a local install.
#   docker compose up -d
# Then use in .env:
#   DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5433/family_budget
# (port 5433 so it doesn't clash with a PostgreSQL already running on 5432)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: family_budget
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
