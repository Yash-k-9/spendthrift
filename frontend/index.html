<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12291f">
  <title>Family Budget Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block">
  <script>
    // Apply the saved light/dark choice before the first paint (see js/theme.js).
    try { const t = localStorage.getItem("budget.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/splash.css">
  <script src="js/splash.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Intro animation (see css/splash.css); removed from the page when it ends -->
  <div id="splash" class="splash" role="presentation" title="Click to skip">
    <div class="splash-stage">
      <div class="note-shadow"></div>
      <div class="note-drop">
        <div class="note">
          <div class="note-half note-top"><div class="note-face"></div></div>
          <div class="note-half note-bottom"><div class="note-face"></div><div class="note-back"></div></div>
          <div class="note-print">
            <span class="note-corner tl">₹</span>
            <span class="note-corner br">₹</span>
            <span class="note-seal">₹</span>
            <div class="note-text">
              <span class="note-title">Planner</span>
              <span class="note-sub">Family Budget</span>
            </div>
          </div>
        </div>
        <div class="note-tube"></div>
      </div>
    </div>
    <p class="splash-skip">Click anywhere to skip</p>
  </div>

  <div class="layout">
    <div class="sidebar-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <h1>Family Budget</h1>
        <p class="muted">AI-based budget planner for savings · SDG 8 &amp; SDG 12</p>
      </div>

      <nav class="side-nav" id="tabs" role="tablist" aria-label="Sections">
        <button data-tab="dashboard" role="tab" data-title="Dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/></svg><span>Dashboard</span></button>
        <button data-tab="insights" role="tab" data-title="Insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg><span>Insights</span></button>
        <button data-tab="predictions" role="tab" data-title="Predictions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg><span>Predictions</span></button>
        <button data-tab="patterns" role="tab" data-title="Patterns"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M17 7m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M7 17m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M17 17m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0"/></svg><span>Patterns</span></button>
        <button data-tab="budgets" role="tab" data-title="Budgets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9zM15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Budgets</span></button>
        <button data-tab="goals" role="tab" data-title="Goals &amp; Rewards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM17 6h3a3 3 0 0 1-3 4M7 6H4a3 3 0 0 0 3 4"/></svg><span>Goals &amp; Rewards</span></button>
        <button data-tab="add" role="tab" data-title="Add / Import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add / Import</span></button>
        <button data-tab="transactions" role="tab" data-title="Transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Transactions</span></button>
        <button data-tab="sms" role="tab" data-title="SMS &amp; Security"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6zM9 12l2 2 4-4"/></svg><span>SMS &amp; Security</span></button>
        <button data-tab="models" role="tab" data-title="Models"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v4l-5 9a3 3 0 0 0 3 5h8a3 3 0 0 0 3-5l-5-9V3"/></svg><span>Models</span></button>
      </nav>

      <label class="field">
        <span>Month</span>
        <select id="month-select"></select>
      </label>

      <details class="panel">
        <summary>Settings</summary>
        <div class="theme-row">
          <span>Theme</span>
          <button type="button" id="theme-toggle" class="theme-switch" role="switch" aria-checked="false"
                  aria-label="Dark theme">
            <span class="theme-track"><span class="theme-thumb">
              <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            </span></span>
            <span class="theme-name">Light</span>
          </button>
        </div>
        <button type="button" id="theme-follow" class="theme-follow" hidden>Follow system setting</button>
        <form id="settings-form" class="stack">
          <label class="field"><span>Currency symbol</span>
            <input name="currency" maxlength="4" required></label>
          <label class="field"><span>Savings goal (% of income): <b id="goal-value"></b></span>
            <input name="savings_goal_pct" type="range" min="5" max="60"></label>
          <label class="field"><span>Family members</span>
            <input name="family_size" type="number" min="1" max="20" required></label>
          <button type="submit" class="btn full">Save settings</button>
        </form>
      </details>

      <details class="panel">
        <summary>Data</summary>
        <div class="stack">
          <button id="load-demo" class="btn secondary full">Load demo family (12 months)</button>
          <button id="clear-all" class="btn danger-outline full">Delete all transactions</button>
        </div>
      </details>

      <p class="side-note">All AI runs on this computer: six ML algorithms written from scratch. No API key needed.</p>
    </aside>
    </div>

    <main class="main">
      <header class="page-head"><h2 id="page-title">Dashboard</h2></header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toasts" class="toasts"></div>
</body>
</html>
